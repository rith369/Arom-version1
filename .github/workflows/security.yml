# Security tests on every pull request and every change to main.
# See BACKEND-HANDOFF.md section 46. Never connects to Supabase or Vercel.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 01:00 UTC, so new advisories on packages show up without a change.
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Database and code security tests
        run: npm run test:security
      - name: Type check
        run: npx next typegen && npx tsc --noEmit
      - name: Known weaknesses in packages the live site uses
        run: npm audit --omit=dev --audit-level=high
